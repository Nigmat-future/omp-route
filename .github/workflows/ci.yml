name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Assert zero runtime dependencies
        shell: bash
        run: |
          node -e '
            const pkg = require("./package.json");
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error("Runtime dependencies are not allowed: " + deps.join(", "));
              process.exit(1);
            }
            console.log("ok: 0 runtime dependencies");
          '

      - name: Run tests
        run: npm test

      - name: Smoke-test the CLI
        run: node bin/omp-route.js --help
